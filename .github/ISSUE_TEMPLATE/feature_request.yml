name: Feature request
description: Propose an API improvement and explain who it helps.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the situation, who it affects, and what you do today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain what would improve the experience and how we would know it works.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: API, data, or client impact
      description: Note any affected routes, database changes, or Flutter behavior when known.
