name: Ingengo API CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingengo-api-production
  cancel-in-progress: false

jobs:
  quality:
    name: Lint Test Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ingengo?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ingengo?schema=public
      JWT_ACCESS_SECRET: 12345678901234567890123456789012
      JWT_REFRESH_SECRET: 12345678901234567890123456789012
      OTP_HASH_SECRET: 12345678901234567890123456789012
      GOOGLE_CLIENT_IDS: dummy-google-client-id
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM: Ingengo <no-reply@example.com>
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Test
        run: npm test -- --runInBand --passWithNoTests

      - name: Build
        run: npm run build

  deploy:
    name: Deploy
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_USER: ingengo
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          : "${DEPLOY_HOST:?Set DEPLOY_HOST in the production environment}"
          : "${SSH_PRIVATE_KEY:?Set SSH_PRIVATE_KEY in the production environment}"
          : "${SSH_KNOWN_HOSTS:?Set SSH_KNOWN_HOSTS in the production environment}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/ingengo_deploy_key
          chmod 600 ~/.ssh/ingengo_deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/ingengo_deploy_key >/dev/null
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo 'SSH_KNOWN_HOSTS needs the trusted host key for DEPLOY_HOST.' >&2
            exit 1
          }

      - name: Package exact commit
        env:
          GIT_SHA: ${{ github.sha }}
        run: git archive --format=tar.gz --output="ingengo-api-${GIT_SHA}.tar.gz" "${GIT_SHA}"

      - name: Upload release artifact
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GIT_SHA: ${{ github.sha }}
        run: |
          scp -i ~/.ssh/ingengo_deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "ingengo-api-${GIT_SHA}.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/ingengo/incoming/"

      - name: Deploy exact commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GIT_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/ingengo_deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "/var/www/ingengo/bin/ingengo-api-deploy.sh ${GIT_SHA}"

      - name: Remove local deployment credentials
        if: always()
        run: |
          rm -f ~/.ssh/ingengo_deploy_key
          rm -f "ingengo-api-${{ github.sha }}.tar.gz"
